name: Release

# Triggered by pushing a semver tag (e.g. v1.1.0). Cross-compiles the daemon
# and client for linux/amd64 + linux/arm64, generates manifest.json (see
# scripts/generate-manifest.sh), and publishes everything as GitHub Release
# assets for the tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build daemon (linux/${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w -X homectl/internal/shared/version.Version=${{ github.ref_name }}" \
            -o "dist/homectl-daemon-linux-${{ matrix.arch }}" ./cmd/daemon
      - name: Build client (linux/${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w -X homectl/internal/shared/version.Version=${{ github.ref_name }}" \
            -o "dist/homectl-linux-${{ matrix.arch }}" ./cmd/client
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Generate manifest.json
        run: bash scripts/generate-manifest.sh "${{ github.ref_name }}" "${{ github.repository }}" dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
